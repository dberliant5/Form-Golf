<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORM Driver Story 3</title><style>
:root{--deep:#07120d;--deep2:#153126;--mint:#dce9d7;--paper:#f8faf7;--ink:#173027}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--deep);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button{font:inherit}.top{position:fixed;top:0;left:0;right:0;height:54px;z-index:50;background:rgba(7,18,13,.76);backdrop-filter:blur(18px);display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08)}.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:20px}.track{height:2px;background:rgba(255,255,255,.13);flex:1;overflow:hidden}.track i{display:block;height:100%;width:11%;background:var(--mint);transition:width .5s cubic-bezier(.16,1,.3,1)}.count{font-size:8px;letter-spacing:.15em;color:#9caf9f}.stage{position:fixed;inset:54px 0 0;overflow:hidden;background:radial-gradient(circle at 72% 26%,rgba(113,154,126,.24),transparent 25%),linear-gradient(145deg,#07120d,#10261a 53%,#325640)}.stage:after{content:"";position:absolute;width:92vw;height:92vw;right:-42vw;bottom:-54vw;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 70px rgba(255,255,255,.018),0 0 0 140px rgba(255,255,255,.01)}.ambient{position:absolute;right:-34px;top:57%;width:66vw;max-width:470px;aspect-ratio:1;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:inset 0 0 0 52px rgba(255,255,255,.017),inset 0 0 0 104px rgba(255,255,255,.01);transform:translateY(-50%);transition:transform .6s cubic-bezier(.16,1,.3,1);opacity:.68}.ambient:before{content:"";position:absolute;inset:22%;border:1px solid rgba(220,233,215,.28);border-radius:50%}.ball{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 11px rgba(220,233,215,.07),0 0 28px rgba(220,233,215,.5);transform:translate(calc(-50% + var(--x,0)*70px),-50%);transition:transform .5s cubic-bezier(.16,1,.3,1)}.line{position:absolute;left:50%;bottom:8%;height:68%;width:2px;transform-origin:bottom;transform:translateX(-50%) rotate(calc(var(--a,0)*1deg));background:linear-gradient(180deg,rgba(220,233,215,.05),var(--mint));filter:drop-shadow(0 0 8px rgba(220,233,215,.4));transition:transform .5s cubic-bezier(.16,1,.3,1)}.frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;transition:opacity .34s ease,transform .46s cubic-bezier(.16,1,.3,1);z-index:4}.frame.out{opacity:0;transform:translateX(-7%)}.frame.in{opacity:0;transform:translateX(7%)}.storycopy{position:absolute;left:22px;right:22px;top:24px;z-index:2;pointer-events:none;max-width:620px}.eyebrow{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#9db0a3;font-weight:800}.storycopy h1{font:500 clamp(32px,9vw,54px)/.96 Georgia,serif;letter-spacing:-.045em;margin:8px 0 8px;max-width:700px}.storycopy p{font-size:12px;line-height:1.55;color:#c0cec5;max-width:470px;margin:0}.panel{position:relative;z-index:6;width:min(760px,100%);max-height:calc(100svh - 98px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:rgba(250,252,249,.985);color:var(--ink);border:1px solid rgba(255,255,255,.55);border-radius:26px;padding:26px 20px 20px;box-shadow:0 35px 100px rgba(0,0,0,.34);backdrop-filter:blur(16px);scrollbar-width:thin}.panel h2{font:500 clamp(34px,8vw,48px)/.98 Georgia,serif;letter-spacing:-.045em;margin:10px 0 18px;text-align:center}.panel>.eyebrow{text-align:center;display:block}.choices{display:grid;gap:9px;width:100%;max-width:660px;margin:0 auto}.choice{width:100%;text-align:left;padding:15px 16px;border:1px solid #dce3de;border-radius:16px;background:#fff;color:#20382c;min-height:62px;font-size:14px;font-weight:750;transition:background .2s ease,color .2s ease,transform .15s ease,box-shadow .2s ease}.choice small{display:block;margin-top:4px;font-size:11px;font-weight:500;color:#78877e;line-height:1.35}.choice.on{background:linear-gradient(128deg,#153629 0%,#2d6045 48%,#8eaa85 100%);border-color:#244a37;color:#fff;box-shadow:0 12px 28px rgba(27,63,45,.2)}.choice.on small{color:#e3ece5}.choice:active{transform:scale(.985)}.bottomrow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;position:sticky;bottom:-1px;background:linear-gradient(180deg,rgba(250,252,249,0),rgba(250,252,249,.985) 28%);padding-top:14px}.back{border:0;background:transparent;color:#718077;font-weight:750;padding:10px 2px}.hint{font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#91a097}.hiddenEngine{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-100px;top:-100px;border:0}.toast{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:80;font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:#9bad9f;background:rgba(7,18,13,.75);padding:7px 10px;border-radius:999px;backdrop-filter:blur(10px)}@media(min-width:850px){.frame{padding:44px}.storycopy{left:max(32px,calc((100vw - 1180px)/2));top:40px}.storycopy h1{font-size:58px}.panel{padding:36px 38px 26px;max-height:calc(100svh - 120px)}.choices{grid-template-columns:1fr 1fr}.ambient{right:max(24px,calc((100vw - 1180px)/2));width:min(38vw,470px)}.panel h2{font-size:52px}}@media(max-height:700px){.storycopy{opacity:.32}.panel{max-height:calc(100svh - 76px)}.panel h2{font-size:34px}.choice{min-height:56px;padding:12px 14px}}
</style></head><body><div class="top"><div class="brand">FORM</div><div class="track"><i></i></div><div class="count">01 / 09</div></div><iframe class="hiddenEngine" id="engine" src="/index.html"></iframe><div class="stage" id="stage"><div class="ambient" id="ambient"><i class="line"></i><i class="ball"></i></div><div id="host"></div></div><div class="toast">Choose an answer to continue</div><script>
const steps=[
{k:'FORM · DRIVER FITTING',t:'Build the flight.',q:'Are you right- or left-handed?',p:'We start with the few inputs that change how every later answer should be interpreted.',group:'handed',choices:[['right','Right-handed','Interpret left/right shot direction as a right-handed golfer.'],['left','Left-handed','Mirror shot-direction interpretation for a left-handed golfer.']]},
{k:'STEP 02 · BRAND SCOPE',t:'Set the field.',q:'Which brands should FORM consider?',p:'Keep the market open for the most independent fit, or narrow it if you already know where you will shop.',group:'brandMode',choices:[['all','All brands','Best overall fit across the full eligible market.'],['include','Only selected brands','Rank only manufacturers you choose.'],['exclude','Exclude selected brands','Consider everything except the brands you rule out.'],['single','One-brand fitting','Find the best fit within one manufacturer’s lineup.']]},
{k:'STEP 03 · START LINE',t:'Where does it begin?',q:'Where does your normal drive begin?',p:'Start direction is the first half of the ball-flight story. FORM keeps it separate from curvature on purpose.',group:'start',choices:[['left','Starts left','The ball begins left of your intended target line.'],['straight','Starts mostly straight','The ball launches near your intended target line.'],['right','Starts right','The ball begins right of your intended target line.'],['varies','It varies','No one start direction dominates.']]},
{k:'STEP 04 · CURVATURE',t:'What happens next?',q:'Then what does it do?',p:'Now shape the second half of the flight. The combination is more useful than a single “miss” label.',group:'curve',choices:[['hook','Hooks','Strong curve left.'],['draw','Draws','Moderate curve left.'],['straight','Stays straight','Minimal curvature.'],['fade','Fades','Moderate curve right.'],['slice','Slices','Strong curve right.'],['varies','It varies','Curvature changes enough that no one pattern dominates.']]},
{k:'STEP 05 · COSTLY MISS',t:'Find the penalty.',q:'Which miss actually costs you?',p:'FORM cares most about the pattern that turns into trouble, not just the shot you notice most often.',group:'costly',choices:[['left','Left miss','The damaging miss is left of target.'],['right','Right miss','The damaging miss is right of target.'],['both','Both sides','Trouble can show up on either side.'],['none','No strong side','Your bigger issue is not directional bias.']]},
{k:'STEP 06 · IMPACT',t:'Find the contact pattern.',q:'Where do you usually find the face?',p:'Strike location tells us how the head needs to protect speed and stability when contact moves away from center.',group:'strike',choices:[['toe','Toe side','Contact trends toward the toe.'],['center','Center','Contact is usually near the middle.'],['heel','Heel side','Contact trends toward the heel.'],['varies','It varies','Strike moves around the face.']]},
{k:'STEP 07 · MEASURED SIGNAL',t:'Add data if you have it.',q:'Do you have launch-monitor data?',p:'Measured numbers can sharpen the model, but they should never become a gate to a credible fitting.',group:'lm',choices:[['yes','Yes','I can provide launch-monitor numbers.'],['no','No','Fit me from my observed ball flight and strike pattern.']]},
{k:'STEP 08 · PERFORMANCE',t:'Choose the tradeoff.',q:'Where would you rather lean?',p:'FORM handles launch, spin and trajectory. You only need to tell us how you value useful distance versus tighter misses.',group:'priorityPreset',choices:[['accuracy','Accuracy & forgiveness','Protect dispersion and imperfect contact first.'],['balanced','Balanced','Treat distance and control as equally important.'],['distance','Distance','Lean toward maximizing useful distance.']]},
{k:'STEP 09 · READY',t:'Your target is built.',q:'Ready to see the field?',p:'FORM now has the core signal it needs to rank eligible driver heads against your pattern.',group:'ready',choices:[['ready','Generate my fit','Rank the eligible field using the existing FORM model.']]}
];
let idx=0,answers={};const host=document.getElementById('host'),ambient=document.getElementById('ambient');
function render(){const s=steps[idx];const f=document.createElement('div');f.className='frame in';const selected=answers[s.group];f.innerHTML=`<div class="storycopy"><div class="eyebrow">${s.k}</div><h1>${s.t}</h1><p>${s.p}</p></div><div class="panel"><div class="eyebrow">${s.group==='handed'?'Driver baseline':s.group==='brandMode'?'Brand scope':s.group==='strike'?'Impact pattern':s.group==='priorityPreset'?'Performance preference':s.group==='lm'?'Measured data':'Driver fitting'}</div><h2>${s.q}</h2><div class="choices">${s.choices.map(v=>`<button class="choice ${selected===v[0]?'on':''}" data-v="${v[0]}">${v[1]}<small>${v[2]}</small></button>`).join('')}</div><div class="bottomrow">${idx?'<button class="back">← Back</button>':'<span></span>'}<span class="hint">Select to continue</span></div></div>`;host.innerHTML='';host.appendChild(f);requestAnimationFrame(()=>f.classList.remove('in'));updateTop();syncVisual();requestAnimationFrame(()=>{const p=f.querySelector('.panel');if(p)p.scrollTop=0})}
function updateTop(){document.querySelector('.track i').style.width=((idx+1)/steps.length*100)+'%';document.querySelector('.count').textContent=String(idx+1).padStart(2,'0')+' / '+String(steps.length).padStart(2,'0')}
function syncVisual(){const s=steps[idx],v=answers[s.group]||'';let a=0,x=0;if(s.group==='start'){a=v==='left'?-16:v==='right'?16:v==='varies'?8:0;x=v==='left'?-1:v==='right'?1:0}else if(s.group==='curve'){a=v==='hook'?-26:v==='draw'?-12:v==='slice'?26:v==='fade'?12:0;x=a/26}else if(s.group==='strike'){x=v==='toe'?1:v==='heel'?-1:0}else if(s.group==='priorityPreset'){x=v==='accuracy'?-1:v==='distance'?1:0}ambient.style.setProperty('--a',a);ambient.style.setProperty('--x',x)}
function mirror(group,val){try{const w=document.getElementById('engine').contentWindow,d=w.document;if(group==='brandMode'&&typeof w.setBrandMode==='function'){w.setBrandMode(val);return}if(group==='priorityPreset'){if(w.state){w.state.driverPrioritySplit=val==='accuracy'?25:val==='distance'?75:50;w.state.priorityWeights={accuracy:val==='accuracy'?75:val==='distance'?25:50,distance:val==='distance'?75:val==='accuracy'?25:50}}return}const btn=d.querySelector(`.options[data-group="${group}"] .opt[data-v="${val}"]`);if(btn)btn.click()}catch(e){}}
function advance(){if(idx>=steps.length-1){try{const w=document.getElementById('engine').contentWindow;if(typeof w.FORM_START_DRIVER_RESULTS==='function')w.FORM_START_DRIVER_RESULTS();else if(typeof w.showResults==='function')w.showResults()}catch(e){}return}const old=host.firstElementChild;if(old)old.classList.add('out');setTimeout(()=>{idx++;render()},280)}
document.addEventListener('click',e=>{const b=e.target.closest('.choice');if(b){const s=steps[idx],val=b.dataset.v;answers[s.group]=val;host.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x===b));syncVisual();mirror(s.group,val);setTimeout(advance,260);return}if(e.target.closest('.back')){const old=host.firstElementChild;if(old)old.classList.add('in');setTimeout(()=>{idx=Math.max(0,idx-1);render()},220)}});render();
</script></body></html>
