<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FORM Driver Story</title><style>
:root{--deep:#07120d;--deep2:#153126;--mint:#dce9d7;--muted:#a8b8ae;--paper:#f8faf7;--ink:#173027}*{box-sizing:border-box}html,body{margin:0;background:var(--deep);color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}.top{position:fixed;top:0;left:0;right:0;height:54px;z-index:50;background:rgba(7,18,13,.72);backdrop-filter:blur(18px);display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08)}.brand{font-family:Georgia,serif;letter-spacing:.18em;font-size:20px}.track{height:2px;background:rgba(255,255,255,.13);flex:1;overflow:hidden}.track i{display:block;height:100%;width:11%;background:var(--mint);transition:width .45s cubic-bezier(.16,1,.3,1)}.count{font-size:8px;letter-spacing:.15em;color:#9caf9f}.chapter{min-height:178svh;position:relative;background:var(--deep)}.scene{position:sticky;top:54px;height:calc(100svh - 54px);overflow:hidden;background:radial-gradient(circle at 72% 26%,rgba(113,154,126,.24),transparent 25%),linear-gradient(145deg,#07120d,#10261a 53%,#325640)}.scene:after{content:"";position:absolute;width:90vw;height:90vw;right:-42vw;bottom:-52vw;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 70px rgba(255,255,255,.018),0 0 0 140px rgba(255,255,255,.01);transform:scale(calc(.92 + var(--p,0)*.14))}.copy{position:absolute;left:24px;right:24px;top:8vh;z-index:3}.eyebrow{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:#9db0a3;font-weight:800}.copy h1{font:500 clamp(52px,14vw,76px)/.91 Georgia,serif;letter-spacing:-.055em;margin:12px 0 18px;max-width:560px}.copy p{font-size:13px;line-height:1.7;color:#c0cec5;max-width:440px}.viz{position:absolute;right:-38px;top:59%;width:68vw;aspect-ratio:1;border:1px solid rgba(255,255,255,.14);border-radius:50%;box-shadow:inset 0 0 0 52px rgba(255,255,255,.017),inset 0 0 0 104px rgba(255,255,255,.01);transform:translateY(calc(-50% + var(--p,0)*22px))}.viz:before{content:"";position:absolute;inset:22%;border:1px solid rgba(220,233,215,.28);border-radius:50%}.ball{position:absolute;left:50%;top:50%;width:14px;height:14px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 11px rgba(220,233,215,.07),0 0 28px rgba(220,233,215,.5);transform:translate(calc(-50% + var(--x,0)*70px),-50%);transition:transform .45s cubic-bezier(.16,1,.3,1)}.line{position:absolute;left:50%;bottom:8%;height:68%;width:2px;transform-origin:bottom;transform:translateX(-50%) rotate(calc(var(--a,0)*1deg));background:linear-gradient(180deg,rgba(220,233,215,.05),var(--mint));filter:drop-shadow(0 0 8px rgba(220,233,215,.4));transition:transform .45s cubic-bezier(.16,1,.3,1)}.scroll{position:absolute;left:24px;bottom:22px;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:#94a69a}.answer{position:relative;z-index:10;width:calc(100% - 24px);margin:-17svh auto 0;padding-bottom:15svh}.card{background:rgba(250,252,249,.99);color:var(--ink);border-radius:26px;padding:30px 22px;box-shadow:0 45px 120px rgba(0,0,0,.38)}.card .eyebrow{display:inline-flex;padding:7px 10px;border:1px solid #d7dfd8;border-radius:999px;color:#6d7c73;background:white}.card h2{font:500 46px/.96 Georgia,serif;letter-spacing:-.05em;margin:18px 0}.card p{color:#6b786f;line-height:1.65}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;padding:18px;border:1px solid #dce3de;border-radius:17px;background:white;color:#20382c;min-height:72px;font-size:15px;font-weight:700}.choice small{display:block;margin-top:6px;font-weight:500;color:#78877e;line-height:1.4}.choice.on{background:linear-gradient(128deg,#153629 0%,#2d6045 48%,#8eaa85 100%);border-color:#244a37;color:white;box-shadow:0 14px 32px rgba(27,63,45,.2)}.choice.on small{color:#e3ece5}.nav{display:flex;justify-content:flex-end;margin-top:24px}.next{border:0;border-radius:999px;background:#18382a;color:white;padding:15px 22px;font-weight:800;letter-spacing:.04em}.hiddenEngine{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-100px;top:-100px;border:0}.note{position:fixed;z-index:60;bottom:12px;left:50%;transform:translateX(-50%);font-size:7px;letter-spacing:.14em;text-transform:uppercase;color:#95a79b;background:rgba(7,18,13,.72);padding:7px 10px;border-radius:999px;backdrop-filter:blur(10px)}@media(min-width:850px){.copy{left:max(32px,calc((100vw - 1180px)/2));top:11vh}.viz{right:max(20px,calc((100vw - 1180px)/2));width:min(38vw,460px)}.answer{width:min(760px,calc(100% - 40px))}.card{padding:54px}.choices{grid-template-columns:1fr 1fr}.copy h1{font-size:88px}.scene{top:54px}}
</style></head><body><div class="top"><div class="brand">FORM</div><div class="track"><i></i></div><div class="count">01 / 04</div></div><iframe class="hiddenEngine" id="engine" src="/index.html"></iframe><main id="story"></main><div class="note">Isolated concept build · same driver fitting content</div><script>
const chapters=[
 {k:'FORM · DRIVER FITTING',t:'Build the flight.',q:'Are you right- or left-handed?',p:'We start with the few inputs that change how every later answer should be interpreted.',group:'handed',choices:[['right','Right-handed','Interpret left/right shot direction as a right-handed golfer.'],['left','Left-handed','Mirror shot-direction interpretation for a left-handed golfer.']]},
 {k:'CHAPTER 02 · START LINE',t:'Where does it begin?',q:'Where does your normal drive begin?',p:'Start direction is the first half of your ball-flight story. FORM keeps it separate from curvature on purpose.',group:'start',choices:[['left','Starts left','The ball begins left of your intended target line.'],['straight','Starts mostly straight','The ball launches near your intended target line.'],['right','Starts right','The ball begins right of your intended target line.'],['varies','It varies','Your start direction changes enough that no one pattern dominates.']]},
 {k:'CHAPTER 03 · CURVATURE',t:'What happens next?',q:'Then what does it do?',p:'Now shape the second half of the flight. The combination is more useful than a single miss label.',group:'curve',choices:[['hook','Hooks','Strong curve left.'],['draw','Draws','Moderate curve left.'],['straight','Stays straight','Minimal curvature.'],['fade','Fades','Moderate curve right.'],['slice','Slices','Strong curve right.'],['varies','It varies','Curvature changes from swing to swing.']]},
 {k:'CHAPTER 04 · IMPACT',t:'Find the miss that matters.',q:'Where do you usually find the face?',p:'Direction tells us where the penalty lives. Strike location tells us how the head needs to protect you.',group:'strike',choices:[['toe','Toe side','Contact trends toward the toe.'],['center','Center','Contact is usually near the middle.'],['heel','Heel side','Contact trends toward the heel.'],['varies','It varies','Strike moves around the face.']]}
];
let answers={handed:'right',start:'straight',curve:'straight',strike:'center'};const story=document.getElementById('story');
function build(){story.innerHTML=chapters.map((c,i)=>`<section class="chapter" data-i="${i}" style="--x:0;--a:0;--p:0"><div class="scene"><div class="copy"><div class="eyebrow">${c.k}</div><h1>${c.t}</h1><p>${c.p}</p></div><div class="viz"><i class="line"></i><i class="ball"></i></div><div class="scroll">Scroll to answer ↓</div></div><div class="answer"><div class="card"><div class="eyebrow">${c.group==='handed'?'Driver baseline':c.group==='strike'?'Impact pattern':'Ball flight'}</div><h2>${c.q}</h2><div class="choices">${c.choices.map(v=>`<button class="choice ${answers[c.group]===v[0]?'on':''}" data-group="${c.group}" data-v="${v[0]}">${v[1]}<small>${v[2]}</small></button>`).join('')}</div>${i<chapters.length-1?'<div class="nav"><button class="next">Continue ↓</button></div>':''}</div></div></section>`).join('');syncAll()}
function syncAll(){document.querySelectorAll('.chapter').forEach(sec=>{const c=chapters[+sec.dataset.i],v=answers[c.group];let a=0,x=0;if(c.group==='start'){a=v==='left'?-16:v==='right'?16:v==='varies'?8:0;x=v==='left'?-1:v==='right'?1:0}else if(c.group==='curve'){a=v==='hook'?-26:v==='draw'?-12:v==='slice'?26:v==='fade'?12:0;x=a/26}else if(c.group==='strike'){x=v==='toe'?1:v==='heel'?-1:0}sec.style.setProperty('--a',a);sec.style.setProperty('--x',x)})}
document.addEventListener('click',e=>{const b=e.target.closest('.choice');if(b){answers[b.dataset.group]=b.dataset.v;document.querySelectorAll(`.choice[data-group="${b.dataset.group}"]`).forEach(x=>x.classList.toggle('on',x===b));syncAll();mirror(b.dataset.group,b.dataset.v)}const n=e.target.closest('.next');if(n){const sec=n.closest('.chapter'),next=sec.nextElementSibling;if(next)next.scrollIntoView({behavior:'smooth'})}});
function mirror(group,val){try{const d=document.getElementById('engine').contentDocument;if(!d)return;const btn=d.querySelector(`.options[data-group="${group}"] .opt[data-v="${val}"]`);if(btn)btn.click()}catch(e){}}
function tick(){const vh=innerHeight;let nearest=0,best=1e9;document.querySelectorAll('.chapter').forEach((sec,i)=>{const r=sec.getBoundingClientRect(),travel=Math.max(r.height-vh,1),p=Math.max(0,Math.min(1,-r.top/travel));sec.style.setProperty('--p',p.toFixed(3));const d=Math.abs(r.top);if(d<best){best=d;nearest=i}});document.querySelector('.track i').style.width=((nearest+1)/chapters.length*100)+'%';document.querySelector('.count').textContent=String(nearest+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0');requestAnimationFrame(tick)}build();requestAnimationFrame(tick);
</script></body></html>
