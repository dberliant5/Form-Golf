const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
const r1=v=>Math.round(Number(v||0)*10)/10;
function compMap(s){return Object.fromEntries((s?.components||[]).map(x=>[x.key,{score:x.score,weight:x.normalizedWeight,evidence:x.evidenceConfidence,rawWeight:x.weight}]));}
function diffComps(a,b){const A=compMap(a),B=compMap(b),keys=[...new Set([...Object.keys(A),...Object.keys(B)])];return keys.map(k=>({key:k,a:A[k]||null,b:B[k]||null,scoreDelta:A[k]&&B[k]?r1(B[k].score-A[k].score):null,weightDelta:A[k]&&B[k]?r1(B[k].weight-A[k].weight):null,evidenceDelta:A[k]&&B[k]?r1(B[k].evidence-A[k].evidence):null,rawWeightDelta:A[k]&&B[k]?r1((B[k].rawWeight??0)-(A[k].rawWeight??0)):null})).filter(x=>!x.a||!x.b||Math.abs(x.scoreDelta)>0||Math.abs(x.weightDelta)>0||Math.abs(x.evidenceDelta)>0||Math.abs(x.rawWeightDelta)>0);}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable v80 missing');await loadScript(w,'tests/driver-regression-matrix-v219.js');const stable=w.FORM_DRIVER_ENGINE_V80;const stableScoreSource=String(stable.scoreOne);const stableProbe=w.FORM_DRIVER_REGRESSION_V219.run().results.find(x=>x.id==='M01');await loadScript(w,'tests/driver-continuous-flight-v224.js');const v224=w.FORM_DRIVER_CONTINUOUS_FLIGHT_V224;if(!v224)throw new Error('v224 wrapper missing');const original=w.FORM_DRIVER_ENGINE_V80;w.FORM_DRIVER_ENGINE_V80=v224;const report224=w.FORM_DRIVER_REGRESSION_V219.run();w.FORM_DRIVER_ENGINE_V80=original;await loadScript(w,'assets/driver-engine-v225.js');const v225=w.FORM_DRIVER_ENGINE_V80;if(v225===stable)throw new Error('v225 not loaded');const v225ScoreSource=String(v225.scoreOne);const report225=w.FORM_DRIVER_REGRESSION_V219.run();const by224=Object.fromEntries(report224.results.map(x=>[x.id,x])),by225=Object.fromEntries(report225.results.map(x=>[x.id,x]));const rows=[];for(const id of Object.keys(by224)){const a=by224[id],b=by225[id];const aBy=Object.fromEntries((a.top10||[]).map(x=>[x.product,x])),bBy=Object.fromEntries((b.top10||[]).map(x=>[x.product,x]));const products=[...new Set([...Object.keys(aBy),...Object.keys(bBy)])];const productDiffs=products.map(p=>{const x=aBy[p],y=bBy[p];return {product:p,rank224:x?.rank??null,rank225:y?.rank??null,overall224:x?.score??null,overall225:y?.score??null,overallDelta:x&&y?r1(y.score-x.score):null,rawDelta:x&&y?r1(y.raw-x.raw):null,componentDiffs:x&&y?diffComps({components:Object.entries(x.components||{}).map(([key,c])=>({key,score:c.score,normalizedWeight:c.weight,evidenceConfidence:c.evidenceConfidence,weight:null}))},{components:Object.entries(y.components||{}).map(([key,c])=>({key,score:c.score,normalizedWeight:c.weight,evidenceConfidence:c.evidenceConfidence,weight:null}))}):[]};}).filter(x=>x.rank224!==x.rank225||Math.abs(x.overallDelta||0)>0||Math.abs(x.rawDelta||0)>0||x.componentDiffs.length);rows.push({id,top224:a.top,top225:b.top,topChanged:a.top!==b.top,score224:a.topScore,score225:b.topScore,topDelta:r1((b.topScore??0)-(a.topScore??0)),productDiffs});}
const changed=rows.filter(x=>x.topChanged||Math.abs(x.topDelta)>0||x.productDiffs.length);const componentCounts={};changed.forEach(c=>c.productDiffs.forEach(p=>p.componentDiffs.forEach(d=>{componentCounts[d.key]=(componentCounts[d.key]||0)+1;})));const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,caseCount:rows.length,topChangedCases:rows.filter(x=>x.topChanged).length,casesWithAnyDifference:changed.length,componentDifferenceCounts:componentCounts,diagnostics:{stableM01ComponentKeys:Object.keys(stableProbe?.top10?.[0]?.components||{}),stableScoreSource,v225ScoreSource},changed};window.FORM_V224_V225_EQUIV=report;out.textContent=JSON.stringify(report,null,2);w.FORM_DRIVER_ENGINE_V80=stable;}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent=String(e.stack||e));
</script></body></html>
