<!doctype html><html><head><meta charset="utf-8"><title>Driver Config v228 Comparison</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'gate='+Date.now()+Math.random();s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
function waitFor(fn,ms=12000){return new Promise((res,rej)=>{const st=Date.now(),t=setInterval(()=>{try{if(fn()){clearInterval(t);res();return}}catch(e){}if(Date.now()-st>ms){clearInterval(t);rej(new Error('Timed out waiting for config runtime'));}},25);});}
function byId(r){return Object.fromEntries(r.rows.map(x=>[x.id,x]));}
async function run(){const w=frame.contentWindow;await waitFor(()=>w.FORM_DRIVER_CONFIG_V81?.loftFit);await loadScript(w,'tests/driver-config-regression-v227.js');const stable=w.FORM_DRIVER_CONFIG_REGRESSION_V227.run();await loadScript(w,'tests/driver-config-continuous-v228.js');const candidate=w.FORM_DRIVER_CONFIG_REGRESSION_V227.run();const S=byId(stable),C=byId(candidate);const pair=(a,b)=>({pair:`${a}->${b}`,stableDelta:Math.round((S[b].loft-S[a].loft)*10)/10,candidateDelta:Math.round((C[b].loft-C[a].loft)*10)/10,stable:[S[a].loft,S[b].loft],candidate:[C[a].loft,C[b].loft]});const boundaryPairs=[pair('L1','L2'),pair('SL1','SL2'),pair('SH1','SH2')],aoaPairs=[pair('AOAD1','AOAD2'),pair('AOAU1','AOAU2')];const checks={launchCliffRemoved:Math.abs(boundaryPairs[0].candidateDelta)<=.5,lowSpinCliffRemoved:Math.abs(boundaryPairs[1].candidateDelta)<=.5,highSpinCliffRemoved:Math.abs(boundaryPairs[2].candidateDelta)<=.5,speedAware:C.SPD70.loft!==C.SPD105.loft,slowSpeedGetsAtLeastAsMuchLoft:C.SPD70.loft>=C.SPD95.loft&&C.SPD95.loft>=C.SPD105.loft,missingPreserved:C.MISSING.loft===S.MISSING.loft,lowspinProductPreserved:C.LOWSPIN.loft-S.LOWSPIN.loft===0,conflictStillFlagged:C.CON1.conflict===true&&C.CON2.conflict===true,aoaBehaviorUnchanged:aoaPairs.every((p,i)=>p.stableDelta===p.candidateDelta)};const report={generatedAt:new Date().toISOString(),stable,candidate,boundaryPairs,aoaPairs,checks,passed:Object.values(checks).every(Boolean),selected:{stable:{SPD70:S.SPD70,SPD95:S.SPD95,SPD105:S.SPD105,CON1:S.CON1,CON2:S.CON2},candidate:{SPD70:C.SPD70,SPD95:C.SPD95,SPD105:C.SPD105,CON1:C.CON1,CON2:C.CON2}}};window.FORM_DRIVER_CONFIG_V228_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent='Error: '+String(e.stack||e));
</script></body></html>
