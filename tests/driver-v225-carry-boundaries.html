<!doctype html><html><head><meta charset="utf-8"><title>FORM v225 Carry Boundaries</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
const clone=v=>JSON.parse(JSON.stringify(v));
function setMetric(w,id,mode,value){w.state.metrics=w.state.metrics||{};w.state.metrics[id]={mode,value};}
function snap(w,engine,id,launch,spin){const saved=clone(w.state),g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());try{setMetric(w,'speed','exact',95);setMetric(w,'aoa','exact',3);setMetric(w,'launch','exact',launch);setMetric(w,'spin','exact',spin);setMetric(w,'carry','exact',240);setMetric(w,'ballSpeed','unknown',null);g.strike='center';g.curveClass='fade_curve';g.costly='right';w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});const rows=engine.winners(g);const top=rows[0];return {id,top:top?`${top.p.brand} ${top.p.model}`:null,score:top?.s?.overall??null,carry:top?.s?.components?.find(x=>x.key==='carry')?.score??null,launchPart:top?.s?.components?.find(x=>x.key==='launch')?.score??null,spinPart:top?.s?.components?.find(x=>x.key==='spin')?.score??null};}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}}
function suite(w,e){return [snap(w,e,'CL1',10.9,2300),snap(w,e,'CL2',11.1,2300),snap(w,e,'CS1',11,2090),snap(w,e,'CS2',11,2110),snap(w,e,'CH1',12.5,2990),snap(w,e,'CH2',12.5,3010)];}
function pair(a,b){return {pair:`${a.id}->${b.id}`,topChanged:a.top!==b.top,topScoreDelta:Math.round((b.score-a.score)*10)/10,carryScoreDelta:Math.round((b.carry-a.carry)*10)/10};}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable v80 missing');const stableEngine=w.FORM_DRIVER_ENGINE_V80,stable=suite(w,stableEngine);await loadScript(w,'assets/driver-engine-v225.js');const candidate=w.FORM_DRIVER_ENGINE_V80;if(candidate===stableEngine)throw new Error('Generated v225 did not replace engine');const cand=suite(w,candidate);w.FORM_DRIVER_ENGINE_V80=stableEngine;const stablePairs=[pair(stable[0],stable[1]),pair(stable[2],stable[3]),pair(stable[4],stable[5])],candidatePairs=[pair(cand[0],cand[1]),pair(cand[2],cand[3]),pair(cand[4],cand[5])];const checks={launchBoundarySmooth:Math.abs(candidatePairs[0].topScoreDelta)<=0.3&&!candidatePairs[0].topChanged,lowSpinBoundarySmooth:Math.abs(candidatePairs[1].topScoreDelta)<=0.3&&!candidatePairs[1].topChanged,highSpinBoundarySmooth:Math.abs(candidatePairs[2].topScoreDelta)<=0.3&&!candidatePairs[2].topChanged};const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,stable, candidate:cand,stablePairs,candidatePairs,checks,passed:Object.values(checks).every(Boolean)};window.FORM_V225_CARRY_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent=String(e.stack||e));
</script></body></html>
