<!doctype html><html><head><meta charset="utf-8"><title>FORM v225 Production Candidate</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
const clone=v=>JSON.parse(JSON.stringify(v));
function rankMap(r){return Object.fromEntries((r?.top10||[]).map(x=>[x.product,x.rank]));}
function compareCase(a,b){const A=rankMap(a),B=rankMap(b),names=[...new Set([...Object.keys(A),...Object.keys(B)])],moves=names.map(n=>({product:n,from:A[n]??null,to:B[n]??null,delta:A[n]!=null&&B[n]!=null?B[n]-A[n]:null})).filter(x=>x.from!==x.to);return {id:a.id,stableTop:a.top,candidateTop:b.top,topChanged:a.top!==b.top,stableScore:a.topScore,candidateScore:b.topScore,topScoreDelta:Math.round(((b.topScore??0)-(a.topScore??0))*10)/10,moves:moves.length,rankMoves:moves};}
function setMetric(w,id,mode,value){w.state.metrics=w.state.metrics||{};w.state.metrics[id]={mode,value};}
function carrySnapshot(w,engine,id,launch,spin){const saved=clone(w.state),g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());try{setMetric(w,'speed','exact',95);setMetric(w,'aoa','exact',3);setMetric(w,'launch','exact',launch);setMetric(w,'spin','exact',spin);setMetric(w,'carry','exact',240);setMetric(w,'ballSpeed','unknown',null);g.strike='center';g.curveClass='fade_curve';g.costly='right';w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});const rows=engine.winners(g);return {id,top:rows[0]?`${rows[0].p.brand} ${rows[0].p.model}`:null,score:rows[0]?.s?.overall??null,top5:rows.slice(0,5).map((r,i)=>({rank:i+1,product:`${r.p.brand} ${r.p.model}`,score:r.s.overall,carry:r.s.components?.find(x=>x.key==='carry')?.score??null,launch:r.s.components?.find(x=>x.key==='launch')?.score??null,spin:r.s.components?.find(x=>x.key==='spin')?.score??null}))};}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}}
function carrySuite(w,engine){return [carrySnapshot(w,engine,'CL1',10.9,2300),carrySnapshot(w,engine,'CL2',11.1,2300),carrySnapshot(w,engine,'CS1',11,2090),carrySnapshot(w,engine,'CS2',11,2110),carrySnapshot(w,engine,'CH1',12.5,2990),carrySnapshot(w,engine,'CH2',12.5,3010)];}
function pair(a,b){return {pair:`${a.id}->${b.id}`,topChanged:a.top!==b.top,topScoreDelta:Math.round((b.score-a.score)*10)/10,carryScoreDelta:Math.round(((b.top5[0]?.carry??0)-(a.top5[0]?.carry??0))*10)/10};}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable v80 missing');await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');const stableEngine=w.FORM_DRIVER_ENGINE_V80;const stable=w.FORM_DRIVER_REGRESSION_V219.run();const stableAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();const stableCarry=carrySuite(w,stableEngine);await loadScript(w,'assets/driver-engine-v225.js');const candidate=w.FORM_DRIVER_ENGINE_V80;if(candidate===stableEngine)throw new Error('Generated v225 did not replace engine object');const candidateReport=w.FORM_DRIVER_REGRESSION_V219.run();const candidateAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();const candidateCarry=carrySuite(w,candidate);w.FORM_DRIVER_ENGINE_V80=stableEngine;const byCandidate=Object.fromEntries(candidateReport.results.map(x=>[x.id,x]));const comparisons=stable.results.map(x=>compareCase(x,byCandidate[x.id]));const thresholdIds=['R01','R02','R04','R06'];const carryPairs={stable:[pair(stableCarry[0],stableCarry[1]),pair(stableCarry[2],stableCarry[3]),pair(stableCarry[4],stableCarry[5])],candidate:[pair(candidateCarry[0],candidateCarry[1]),pair(candidateCarry[2],candidateCarry[3]),pair(candidateCarry[4],candidateCarry[5])]};const summary={topChangedCases:comparisons.filter(x=>x.topChanged).length,casesWithAbsTopScoreDeltaOver2:comparisons.filter(x=>Math.abs(x.topScoreDelta)>2).length,avgAbsTopScoreDelta:Math.round(comparisons.reduce((a,x)=>a+Math.abs(x.topScoreDelta),0)/comparisons.length*100)/100,totalTop10PositionChanges:comparisons.reduce((a,x)=>a+x.moves,0)};const checks={caseCountPreserved:stable.caseCount===candidateReport.caseCount,aoaStable:JSON.stringify(stableAoa.checks)===JSON.stringify(candidateAoa.checks),launchBoundarySmooth:Math.abs(candidateReport.pairChecks.find(x=>x.a==='R04')?.topScoreDelta??99)<=0.3,spinBoundarySmooth:Math.abs(candidateReport.pairChecks.find(x=>x.a==='R06')?.topScoreDelta??99)<=0.3,carryLaunchBoundarySmooth:Math.abs(carryPairs.candidate[0].topScoreDelta)<=0.3&&!carryPairs.candidate[0].topChanged,carryLowSpinBoundarySmooth:Math.abs(carryPairs.candidate[1].topScoreDelta)<=0.3&&!carryPairs.candidate[1].topChanged,carryHighSpinBoundarySmooth:Math.abs(carryPairs.candidate[2].topScoreDelta)<=0.3&&!carryPairs.candidate[2].topChanged,limitedWinnerChurn:summary.topChangedCases<=3,noLargeScoreChurn:summary.casesWithAbsTopScoreDeltaOver2<=3};const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,candidate:'assets/driver-engine-v225.js',summary,checks,passed:Object.values(checks).every(Boolean),thresholds:{stable:stable.pairChecks.filter(x=>thresholdIds.includes(x.a)),candidate:candidateReport.pairChecks.filter(x=>thresholdIds.includes(x.a))},carryPairs,carry:{stable:stableCarry,candidate:candidateCarry},topChanged:comparisons.filter(x=>x.topChanged),comparisons};window.FORM_V225_CANDIDATE_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>{out.textContent=String(e.stack||e)});
</script></body></html>
