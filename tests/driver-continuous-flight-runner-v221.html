<!doctype html><html><head><meta charset="utf-8"><title>FORM Continuous Flight v221</title></head><body><button id="run">Run comparison</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;w.document.body.appendChild(s);});}
function rankMap(r){return Object.fromEntries((r?.top10||[]).map(x=>[x.product,x.rank]));}
function compareCase(a,b){const A=rankMap(a),B=rankMap(b),names=[...new Set([...Object.keys(A),...Object.keys(B)])],moves=names.map(n=>({product:n,from:A[n]??null,to:B[n]??null,delta:A[n]!=null&&B[n]!=null?B[n]-A[n]:null})).filter(x=>x.from!==x.to);return {id:a.id,stableTop:a.top,altTop:b.top,topChanged:a.top!==b.top,stableScore:a.topScore,altScore:b.topScore,topScoreDelta:Math.round(((b.topScore??0)-(a.topScore??0))*10)/10,moves:moves.length,rankMoves:moves};}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable engine missing');await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');await loadScript(w,'tests/driver-continuous-flight-v221.js');const stableEngine=w.FORM_DRIVER_ENGINE_V80;const stable=w.FORM_DRIVER_REGRESSION_V219.run();const stableAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();w.FORM_DRIVER_ENGINE_V80=w.FORM_DRIVER_CONTINUOUS_FLIGHT_V221;const alt=w.FORM_DRIVER_REGRESSION_V219.run();const altAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();w.FORM_DRIVER_ENGINE_V80=stableEngine;const byAlt=Object.fromEntries(alt.results.map(x=>[x.id,x]));const caseComparisons=stable.results.map(x=>compareCase(x,byAlt[x.id]));const thresholdIds=['R01','R02','R04','R06'];const thresholdStable=stable.pairChecks.filter(x=>thresholdIds.includes(x.a)),thresholdAlt=alt.pairChecks.filter(x=>thresholdIds.includes(x.a));const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,experiment:'continuous-speed-aware-flight-v221',stable:{caseCount:stable.caseCount,aoa:stableAoa.checks},alternate:{caseCount:alt.caseCount,aoa:altAoa.checks},thresholds:{stable:thresholdStable,alternate:thresholdAlt},caseComparisons,summary:{topChangedCases:caseComparisons.filter(x=>x.topChanged).length,casesWithAbsTopScoreDeltaOver2:caseComparisons.filter(x=>Math.abs(x.topScoreDelta)>2).length,avgAbsTopScoreDelta:Math.round(caseComparisons.reduce((a,x)=>a+Math.abs(x.topScoreDelta),0)/caseComparisons.length*100)/100,totalTop10PositionChanges:caseComparisons.reduce((a,x)=>a+x.moves,0)}};window.FORM_CONTINUOUS_COMPARISON_V221=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>{out.textContent=String(e.stack||e)});
</script></body></html>
