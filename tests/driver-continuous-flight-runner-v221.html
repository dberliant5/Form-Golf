<!doctype html><html><head><meta charset="utf-8"><title>FORM Continuous Flight v221</title></head><body><button id="run">Run comparison</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;w.document.body.appendChild(s);});}
function rankMap(r){return Object.fromEntries((r?.top10||[]).map(x=>[x.product,x.rank]));}
function compareCase(a,b){const A=rankMap(a),B=rankMap(b),names=[...new Set([...Object.keys(A),...Object.keys(B)])],moves=names.map(n=>({product:n,from:A[n]??null,to:B[n]??null,delta:A[n]!=null&&B[n]!=null?B[n]-A[n]:null})).filter(x=>x.from!==x.to);return {id:a.id,stableTop:a.top,altTop:b.top,topChanged:a.top!==b.top,stableScore:a.topScore,altScore:b.topScore,topScoreDelta:Math.round(((b.topScore??0)-(a.topScore??0))*10)/10,moves:moves.length,rankMoves:moves};}
function clone(v){return JSON.parse(JSON.stringify(v));}
function topName(r){return r?`${r.p.brand} ${r.p.model}`:null;}
function sweepOne(w,engine,speed,kind){const saved=clone(w.state),g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());g.strike='center';g.costly=null;g.curveClass=null;w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});w.state.metrics=w.state.metrics||{};const t=w.FORM_DRIVER_CONTINUOUS_FLIGHT_V221.targets(speed);const values=kind==='launch'?Array.from({length:81},(_,i)=>Math.round((t.launch-4+i*.1)*10)/10):Array.from({length:81},(_,i)=>Math.round(t.spin-1000+i*25));const rows=[];try{for(const v of values){w.state.metrics.speed={mode:'exact',value:speed};w.state.metrics.launch={mode:'exact',value:kind==='launch'?v:t.launch};w.state.metrics.spin={mode:'exact',value:kind==='spin'?v:t.spin};w.state.metrics.ballSpeed={mode:'unknown',value:null};w.state.metrics.carry={mode:'unknown',value:null};const ranked=engine.winners(g),top=ranked[0];rows.push({value:v,top:topName(top),score:top?.s?.overall??null,gap:ranked[1]?Math.round((top.s.overall-ranked[1].s.overall)*10)/10:null});}}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}let maxJump=0,topFlips=0,flipPoints=[];for(let i=1;i<rows.length;i++){maxJump=Math.max(maxJump,Math.abs((rows[i].score??0)-(rows[i-1].score??0)));if(rows[i].top!==rows[i-1].top){topFlips++;flipPoints.push({fromValue:rows[i-1].value,toValue:rows[i].value,from:rows[i-1].top,to:rows[i].top,fromGap:rows[i-1].gap,toGap:rows[i].gap});}}return {speed,kind,target:kind==='launch'?t.launch:t.spin,step:kind==='launch'?.1:25,maxAdjacentTopScoreJump:Math.round(maxJump*10)/10,topFlipCount:topFlips,flipPoints};}
function continuitySweep(w,engine){const speeds=[70,85,95,105],out={launch:[],spin:[]};for(const s of speeds){out.launch.push(sweepOne(w,engine,s,'launch'));out.spin.push(sweepOne(w,engine,s,'spin'));}return out;}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable engine missing');await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');await loadScript(w,'tests/driver-continuous-flight-v221.js');const stableEngine=w.FORM_DRIVER_ENGINE_V80;const stable=w.FORM_DRIVER_REGRESSION_V219.run();const stableAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();const stableSweep=continuitySweep(w,stableEngine);w.FORM_DRIVER_ENGINE_V80=w.FORM_DRIVER_CONTINUOUS_FLIGHT_V221;const alt=w.FORM_DRIVER_REGRESSION_V219.run();const altAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run();const altSweep=continuitySweep(w,w.FORM_DRIVER_CONTINUOUS_FLIGHT_V221);w.FORM_DRIVER_ENGINE_V80=stableEngine;const byAlt=Object.fromEntries(alt.results.map(x=>[x.id,x]));const caseComparisons=stable.results.map(x=>compareCase(x,byAlt[x.id]));const thresholdIds=['R01','R02','R04','R06'];const thresholdStable=stable.pairChecks.filter(x=>thresholdIds.includes(x.a)),thresholdAlt=alt.pairChecks.filter(x=>thresholdIds.includes(x.a));const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,experiment:'continuous-speed-aware-flight-v221',stable:{caseCount:stable.caseCount,aoa:stableAoa.checks},alternate:{caseCount:alt.caseCount,aoa:altAoa.checks},thresholds:{stable:thresholdStable,alternate:thresholdAlt},continuity:{stable:stableSweep,alternate:altSweep},caseComparisons,summary:{topChangedCases:caseComparisons.filter(x=>x.topChanged).length,casesWithAbsTopScoreDeltaOver2:caseComparisons.filter(x=>Math.abs(x.topScoreDelta)>2).length,avgAbsTopScoreDelta:Math.round(caseComparisons.reduce((a,x)=>a+Math.abs(x.topScoreDelta),0)/caseComparisons.length*100)/100,totalTop10PositionChanges:caseComparisons.reduce((a,x)=>a+x.moves,0)}};window.FORM_CONTINUOUS_COMPARISON_V221=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>{out.textContent=String(e.stack||e)});
</script></body></html>
