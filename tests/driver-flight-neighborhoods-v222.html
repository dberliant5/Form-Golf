<!doctype html><html><head><meta charset="utf-8"><title>FORM Flight Neighborhoods v222</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;w.document.body.appendChild(s);});}
const clone=v=>JSON.parse(JSON.stringify(v));
const CONTENDERS=[['Callaway','Quantum Max D'],['Tour Edge','Hot Launch Max D'],['Tour Edge','Exotics Max'],['TaylorMade','Qi4D'],['Cobra','OPTM MAX-D']];
function contenderProducts(w){return CONTENDERS.map(([brand,model])=>w.products.find(p=>p.brand===brand&&p.model===model)).filter(Boolean);}
function scoreContenders(w,engine,g){return contenderProducts(w).map(p=>({p,s:engine.scoreOne(p,g)})).filter(r=>!r.s?.hardConstraints?.length).sort((a,b)=>b.s.overall-a.s.overall);}
function name(r){return r?`${r.p.brand} ${r.p.model}`:null;}
function runSeries(w,engine,d){const saved=clone(w.state),g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());g.strike='center';g.costly=null;g.curveClass=null;w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});w.state.metrics=w.state.metrics||{};const rows=[];try{for(const v of d.values){w.state.metrics.speed={mode:'exact',value:d.speed};w.state.metrics.launch={mode:'exact',value:d.kind==='launch'?v:d.launch};w.state.metrics.spin={mode:'exact',value:d.kind==='spin'?v:d.spin};w.state.metrics.aoa={mode:'exact',value:d.aoa??3};w.state.metrics.ballSpeed={mode:'unknown',value:null};w.state.metrics.carry={mode:'unknown',value:null};const ranked=scoreContenders(w,engine,g),top=ranked[0];rows.push({value:v,top:name(top),score:top?.s?.overall??null,gap:ranked[1]?Math.round((top.s.overall-ranked[1].s.overall)*10)/10:null,scores:Object.fromEntries(ranked.map(r=>[name(r),r.s.overall]))});}}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}let maxJump=0,flips=[];for(let i=1;i<rows.length;i++){maxJump=Math.max(maxJump,Math.abs((rows[i].score??0)-(rows[i-1].score??0)));if(rows[i].top!==rows[i-1].top)flips.push({from:rows[i-1],to:rows[i]});}return {label:d.label,maxAdjacentScoreJump:Math.round(maxJump*10)/10,topFlipCount:flips.length,flips,rows};}
function suite(w,engine){const defs=[
{label:'95mph launch 11 boundary',speed:95,launch:11,spin:2300,kind:'launch',values:[10.8,10.9,11,11.1,11.2]},
{label:'95mph spin 2100 boundary',speed:95,launch:11,spin:2100,kind:'spin',values:[2050,2090,2100,2110,2150]},
{label:'95mph spin 3000 boundary',speed:95,launch:12.5,spin:3000,kind:'spin',values:[2950,2990,3000,3010,3050]},
{label:'70mph M03 spin neighborhood',speed:70,launch:10,spin:3100,aoa:-2,kind:'spin',values:[2950,3000,3050,3100,3150]},
{label:'105mph M10 spin neighborhood',speed:105,launch:11,spin:2000,aoa:4,kind:'spin',values:[1900,1950,2000,2050,2100,2150]}
];return defs.map(d=>runSeries(w,engine,d));}
async function run(){const w=frame.contentWindow;if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Stable engine missing');await loadScript(w,'tests/driver-continuous-flight-v221.js');const stable=w.FORM_DRIVER_ENGINE_V80;const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,scope:'frozen contender set',contenders:CONTENDERS.map(x=>x.join(' ')),stable:suite(w,stable),alternate:suite(w,w.FORM_DRIVER_CONTINUOUS_FLIGHT_V221)};window.FORM_FLIGHT_NEIGHBORHOODS_V222=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>{out.textContent=String(e.stack||e)});
</script></body></html>
