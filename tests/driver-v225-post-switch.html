<!doctype html><html><head><meta charset="utf-8"><title>FORM v225 Post Switch</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'gate='+Date.now()+Math.random();s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
function waitFor(fn,ms=12000){return new Promise((res,rej)=>{const start=Date.now(),t=setInterval(()=>{try{if(fn()){clearInterval(t);res();return}}catch(e){}if(Date.now()-start>ms){clearInterval(t);rej(new Error('Timed out waiting for switched FORM runtime'));}},25);});}
async function applyCalibrations(w){delete w.FORM_DRIVER_SCORE_CALIBRATION_V146;delete w.FORM_DRIVER_RANKING_CALIBRATION_V101;delete w.FORM_DRIVER_RANKING_CALIBRATION_V103;await loadScript(w,'assets/driver-score-calibration-v146.js');await waitFor(()=>w.FORM_DRIVER_SCORE_CALIBRATION_V146?.version==='10.47');await loadScript(w,'assets/driver-ranking-calibration-v101.js');await waitFor(()=>w.FORM_DRIVER_RANKING_CALIBRATION_V103===true);}
async function run(){const w=frame.contentWindow;await waitFor(()=>w.FORM_DRIVER_ENGINE_V80);const sources=[...w.document.querySelectorAll('script[src]')].map(s=>s.getAttribute('src')||'');const activeV225=sources.some(x=>x.includes('assets/driver-engine-v225.js'));const staleV80=sources.some(x=>x.includes('assets/driver-engine-v80.js'));if(!activeV225||staleV80)throw new Error('index.html is not exclusively loading v225');await applyCalibrations(w);await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');await loadScript(w,'tests/driver-carry-boundaries-helper-v226.js');const matrix=w.FORM_DRIVER_REGRESSION_V219.run(),aoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run(),carry=w.FORM_DRIVER_CARRY_BOUNDARIES_V226.run();const launch=matrix.pairChecks.find(x=>x.a==='R04'),spin=matrix.pairChecks.find(x=>x.a==='R06'),cp=carry.pairs||[],m07=matrix.results.find(x=>x.id==='M07'),keys=Object.keys(m07?.top10?.[0]?.components||{});const checks={activeV225,staleV80:!staleV80,caseCount:matrix.caseCount===40,aoaInvariant:Object.values(aoa.checks||{}).length===3&&Object.values(aoa.checks||{}).every(Boolean),launchBoundarySmooth:Math.abs(launch?.topScoreDelta??99)<=0.3&&!launch?.topChanged,spinBoundarySmooth:Math.abs(spin?.topScoreDelta??99)<=0.3&&!spin?.topChanged,carryLaunchSmooth:Math.abs(cp[0]?.topScoreDelta??99)<=0.3&&!cp[0]?.topChanged,carryLowSpinSmooth:Math.abs(cp[1]?.topScoreDelta??99)<=0.3&&!cp[1]?.topChanged,carryHighSpinSmooth:Math.abs(cp[2]?.topScoreDelta??99)<=0.3&&!cp[2]?.topChanged,executionPresent:keys.includes('execution'),scoreCalibration:w.FORM_DRIVER_SCORE_CALIBRATION_V146?.version==='10.47',rankingCalibration:w.FORM_DRIVER_RANKING_CALIBRATION_V103===true};const report={generatedAt:new Date().toISOString(),checks,aoaChecks:aoa.checks,passed:Object.values(checks).every(Boolean),thresholds:{launch,spin},carry:cp,componentKeys:keys,sources:sources.filter(x=>x.includes('driver-engine-v'))};window.FORM_V225_POST_SWITCH_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent='Error: '+String(e.stack||e));
</script></body></html>
