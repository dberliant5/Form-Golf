<!doctype html><html><head><meta charset="utf-8"><title>FORM v225 Live Stack Gate</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
const clone=v=>JSON.parse(JSON.stringify(v));
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'gate='+Date.now()+Math.random();s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
function waitFor(fn,ms=12000){return new Promise((res,rej)=>{const start=Date.now(),t=setInterval(()=>{try{if(fn()){clearInterval(t);res();return}}catch(e){}if(Date.now()-start>ms){clearInterval(t);rej(new Error('Timed out waiting for live engine'));}},25);});}
function rankMap(r){return Object.fromEntries((r?.top10||[]).map(x=>[x.product,x.rank]));}
function compareCase(a,b){const A=rankMap(a),B=rankMap(b),names=[...new Set([...Object.keys(A),...Object.keys(B)])],moves=names.filter(n=>A[n]!==B[n]);return {id:a.id,stableTop:a.top,candidateTop:b.top,topChanged:a.top!==b.top,stableScore:a.topScore,candidateScore:b.topScore,topScoreDelta:Math.round(((b.topScore??0)-(a.topScore??0))*10)/10,moves:moves.length};}
function setMetric(w,id,mode,value){w.state.metrics=w.state.metrics||{};w.state.metrics[id]={mode,value};}
function carrySnap(w,engine,id,launch,spin){const saved=clone(w.state);try{setMetric(w,'speed','exact',95);setMetric(w,'aoa','exact',3);setMetric(w,'launch','exact',launch);setMetric(w,'spin','exact',spin);setMetric(w,'carry','exact',240);setMetric(w,'ballSpeed','unknown',null);const g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());g.strike='center';g.curveClass='fade_curve';g.costly='right';w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});const top=engine.winners(g)[0];return {id,top:top?`${top.p.brand} ${top.p.model}`:null,score:top?.s?.overall??null,carry:top?.s?.components?.find(x=>x.key==='carry')?.score??null,componentKeys:(top?.s?.components||[]).map(x=>x.key)};}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}}
function carrySuite(w,e){return [carrySnap(w,e,'CL1',10.9,2300),carrySnap(w,e,'CL2',11.1,2300),carrySnap(w,e,'CS1',11,2090),carrySnap(w,e,'CS2',11,2110),carrySnap(w,e,'CH1',12.5,2990),carrySnap(w,e,'CH2',12.5,3010)];}
function pair(a,b){return {pair:`${a.id}->${b.id}`,topChanged:a.top!==b.top,topScoreDelta:Math.round((b.score-a.score)*10)/10,carryScoreDelta:Math.round((b.carry-a.carry)*10)/10};}
async function run(){const w=frame.contentWindow;await waitFor(()=>w.FORM_DRIVER_ENGINE_V80&&w.FORM_DRIVER_CONFIG_V81);const liveCalibrationFlags={score146:Boolean(w.FORM_DRIVER_SCORE_CALIBRATION_V146),rank101:Boolean(w.FORM_DRIVER_RANKING_CALIBRATION_V101),rank103:Boolean(w.FORM_DRIVER_RANKING_CALIBRATION_V103)};if(Object.values(liveCalibrationFlags).some(Boolean))throw new Error('Live index unexpectedly initialized later calibration layers: '+JSON.stringify(liveCalibrationFlags));await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');const stableEngine=w.FORM_DRIVER_ENGINE_V80,stable=w.FORM_DRIVER_REGRESSION_V219.run(),stableAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run(),stableCarry=carrySuite(w,stableEngine);await loadScript(w,'assets/driver-engine-v225.js');const candidate=w.FORM_DRIVER_ENGINE_V80;if(candidate===stableEngine)throw new Error('v225 did not replace live engine object');const cand=w.FORM_DRIVER_REGRESSION_V219.run(),candAoa=w.FORM_DRIVER_AOA_REGRESSION_V220.run(),candCarry=carrySuite(w,candidate);w.FORM_DRIVER_ENGINE_V80=stableEngine;const by=Object.fromEntries(cand.results.map(x=>[x.id,x])),comparisons=stable.results.map(x=>compareCase(x,by[x.id]));const summary={topChangedCases:comparisons.filter(x=>x.topChanged).length,casesWithAbsTopScoreDeltaOver2:comparisons.filter(x=>Math.abs(x.topScoreDelta)>2).length,avgAbsTopScoreDelta:Math.round(comparisons.reduce((s,x)=>s+Math.abs(x.topScoreDelta),0)/comparisons.length*100)/100,totalTop10PositionChanges:comparisons.reduce((s,x)=>s+x.moves,0)};const candidateLaunch=cand.pairChecks.find(x=>x.a==='R04'),candidateSpin=cand.pairChecks.find(x=>x.a==='R06');const stableCarryPairs=[pair(stableCarry[0],stableCarry[1]),pair(stableCarry[2],stableCarry[3]),pair(stableCarry[4],stableCarry[5])],candidateCarryPairs=[pair(candCarry[0],candCarry[1]),pair(candCarry[2],candCarry[3]),pair(candCarry[4],candCarry[5])];const checks={exactLiveStack:true,noUnexpectedCalibration:Object.values(liveCalibrationFlags).every(v=>!v),caseCountPreserved:stable.caseCount===cand.caseCount,aoaStable:JSON.stringify(stableAoa.checks)===JSON.stringify(candAoa.checks),launchBoundarySmooth:Math.abs(candidateLaunch?.topScoreDelta??99)<=0.3,spinBoundarySmooth:Math.abs(candidateSpin?.topScoreDelta??99)<=0.3,limitedWinnerChurn:summary.topChangedCases<=3,noLargeScoreChurn:summary.casesWithAbsTopScoreDeltaOver2<=3,carryLaunchSmooth:Math.abs(candidateCarryPairs[0].topScoreDelta)<=0.3&&!candidateCarryPairs[0].topChanged,carryLowSpinSmooth:Math.abs(candidateCarryPairs[1].topScoreDelta)<=0.3&&!candidateCarryPairs[1].topChanged,carryHighSpinSmooth:Math.abs(candidateCarryPairs[2].topScoreDelta)<=0.3&&!candidateCarryPairs[2].topChanged,noExecutionComponent:!candCarry[0].componentKeys.includes('execution')};const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,liveCalibrationFlags,summary,checks,passed:Object.values(checks).every(Boolean),thresholds:{stable:stable.pairChecks.filter(x=>['R01','R02','R04','R06'].includes(x.a)),candidate:cand.pairChecks.filter(x=>['R01','R02','R04','R06'].includes(x.a))},topChanged:comparisons.filter(x=>x.topChanged),stableCarryPairs,candidateCarryPairs};window.FORM_V225_LIVE_STACK_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent='Error: '+String(e.stack||e));
</script></body></html>
