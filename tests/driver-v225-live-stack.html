<!doctype html><html><head><meta charset="utf-8"><title>FORM v225 Runtime Modes Gate</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src+(src.includes('?')?'&':'?')+'gate='+Date.now()+Math.random();s.onload=res;s.onerror=()=>rej(new Error('Failed to load '+src));w.document.body.appendChild(s);});}
function waitFor(fn,ms=12000){return new Promise((res,rej)=>{const st=Date.now(),t=setInterval(()=>{try{if(fn()){clearInterval(t);res();return}}catch(e){}if(Date.now()-st>ms){clearInterval(t);rej(new Error('Timed out waiting for FORM runtime'));}},25);});}
function rankMap(r){return Object.fromEntries((r?.top10||[]).map(x=>[x.product,x.rank]));}
function compareCase(a,b){const A=rankMap(a),B=rankMap(b),names=[...new Set([...Object.keys(A),...Object.keys(B)])],moves=names.filter(n=>A[n]!==B[n]);return {id:a.id,stableTop:a.top,candidateTop:b.top,topChanged:a.top!==b.top,stableScore:a.topScore,candidateScore:b.topScore,topScoreDelta:Math.round(((b.topScore??0)-(a.topScore??0))*10)/10,moves:moves.length};}
async function installEngine(w,path,ranked){await loadScript(w,path);if(!w.FORM_DRIVER_ENGINE_V80)throw new Error('Engine did not install from '+path);if(ranked){delete w.FORM_DRIVER_RANKING_CALIBRATION_V101;delete w.FORM_DRIVER_RANKING_CALIBRATION_V103;await loadScript(w,'assets/driver-ranking-calibration-v101.js');await waitFor(()=>w.FORM_DRIVER_RANKING_CALIBRATION_V101===true&&w.FORM_DRIVER_RANKING_CALIBRATION_V103===true);}return w.FORM_DRIVER_ENGINE_V80;}
function modeSnapshot(w){return {matrix:w.FORM_DRIVER_REGRESSION_V219.run(),aoa:w.FORM_DRIVER_AOA_REGRESSION_V220.run(),carry:w.FORM_DRIVER_CARRY_BOUNDARIES_V226.run()};}
function evaluateMode(name,stable,candidate){const by=Object.fromEntries(candidate.matrix.results.map(x=>[x.id,x])),comparisons=stable.matrix.results.map(x=>compareCase(x,by[x.id]));const summary={topChangedCases:comparisons.filter(x=>x.topChanged).length,casesWithAbsTopScoreDeltaOver2:comparisons.filter(x=>Math.abs(x.topScoreDelta)>2).length,avgAbsTopScoreDelta:Math.round(comparisons.reduce((s,x)=>s+Math.abs(x.topScoreDelta),0)/comparisons.length*100)/100,totalTop10PositionChanges:comparisons.reduce((s,x)=>s+x.moves,0)};const launch=candidate.matrix.pairChecks.find(x=>x.a==='R04'),spin=candidate.matrix.pairChecks.find(x=>x.a==='R06'),cp=candidate.carry.pairs;const checks={caseCountPreserved:stable.matrix.caseCount===candidate.matrix.caseCount,aoaStable:JSON.stringify(stable.aoa.checks)===JSON.stringify(candidate.aoa.checks),launchBoundarySmooth:Math.abs(launch?.topScoreDelta??99)<=0.3,spinBoundarySmooth:Math.abs(spin?.topScoreDelta??99)<=0.3,limitedWinnerChurn:summary.topChangedCases<=3,noLargeScoreChurn:summary.casesWithAbsTopScoreDeltaOver2<=3,carryLaunchSmooth:Math.abs(cp[0]?.topScoreDelta??99)<=0.3&&!cp[0]?.topChanged,carryLowSpinSmooth:Math.abs(cp[1]?.topScoreDelta??99)<=0.3&&!cp[1]?.topChanged,carryHighSpinSmooth:Math.abs(cp[2]?.topScoreDelta??99)<=0.3&&!cp[2]?.topChanged};return {name,summary,checks,passed:Object.values(checks).every(Boolean),thresholds:{stable:stable.matrix.pairChecks.filter(x=>['R01','R02','R04','R06'].includes(x.a)),candidate:candidate.matrix.pairChecks.filter(x=>['R01','R02','R04','R06'].includes(x.a))},topChanged:comparisons.filter(x=>x.topChanged),stableCarryPairs:stable.carry.pairs,candidateCarryPairs:candidate.carry.pairs,componentKeys:{stable:stable.carry.rows[0]?.componentKeys,candidate:candidate.carry.rows[0]?.componentKeys}};}
async function run(){const w=frame.contentWindow;
 await waitFor(()=>w.FORM_DRIVER_ENGINE_V80);
 await loadScript(w,'tests/driver-regression-matrix-v219.js');await loadScript(w,'tests/driver-regression-aoa-v220.js');await loadScript(w,'tests/driver-carry-boundaries-helper-v226.js');const initialFlags={score146:Boolean(w.FORM_DRIVER_SCORE_CALIBRATION_V146),rank101:Boolean(w.FORM_DRIVER_RANKING_CALIBRATION_V101),rank103:Boolean(w.FORM_DRIVER_RANKING_CALIBRATION_V103)};
 await installEngine(w,'assets/driver-engine-v80.js',false);const bareStable=modeSnapshot(w);await installEngine(w,'assets/driver-engine-v225.js',false);const bareCandidate=modeSnapshot(w);const bare=evaluateMode('bare',bareStable,bareCandidate);
 await installEngine(w,'assets/driver-engine-v80.js',true);const rankedStable=modeSnapshot(w);await installEngine(w,'assets/driver-engine-v225.js',true);const rankedCandidate=modeSnapshot(w);const ranked=evaluateMode('ranking-execution',rankedStable,rankedCandidate);
 await installEngine(w,'assets/driver-engine-v80.js',false);
 const checks={barePass:bare.passed,rankedPass:ranked.passed,bareNoExecution:!bare.componentKeys.stable.includes('execution')&&!bare.componentKeys.candidate.includes('execution'),rankedExecutionBoth:ranked.componentKeys.stable.includes('execution')&&ranked.componentKeys.candidate.includes('execution')};const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,initialFlags,modes:{bare,ranked},checks,passed:Object.values(checks).every(Boolean)};window.FORM_V225_LIVE_STACK_REPORT=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent='Error: '+String(e.stack||e));
</script></body></html>
