<!doctype html><html><head><meta charset="utf-8"><title>FORM Carry Flight Regression v225</title></head><body><button id="run">Run</button><pre id="out"></pre><iframe id="form" src="../index.html" style="width:1px;height:1px;opacity:0"></iframe><script>
const frame=document.getElementById('form'),out=document.getElementById('out');
function loadScript(w,src){return new Promise((res,rej)=>{const s=w.document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;w.document.body.appendChild(s);});}
const clone=v=>JSON.parse(JSON.stringify(v)),name=r=>r?`${r.p.brand} ${r.p.model}`:null;
function runCase(w,engine,d){const saved=clone(w.state),g=(typeof w.normalizedGolferV69==='function'?w.normalizedGolferV69():w.golfer());try{w.state.metrics=w.state.metrics||{};w.state.metrics.speed={mode:'exact',value:95};w.state.metrics.aoa={mode:'exact',value:3};w.state.metrics.launch={mode:'exact',value:d.launch};w.state.metrics.spin={mode:'exact',value:d.spin};w.state.metrics.carry={mode:'exact',value:230};w.state.metrics.ballSpeed={mode:'unknown',value:null};g.strike='center';g.costly=null;g.curveClass=null;w.state.ranks=w.state.ranks||{};Object.assign(w.state.ranks,{accuracy:2,distance:2,flight:2});const rows=engine.winners(g).slice(0,5),top=rows[0];return {id:d.id,launch:d.launch,spin:d.spin,top:name(top),topScore:top?.s?.overall??null,top5:rows.map((r,i)=>({rank:i+1,product:name(r),score:r.s.overall,carry:r.s.components?.find(x=>x.key==='carry')?.score??null,launchComponent:r.s.components?.find(x=>x.key==='launch')?.score??null,spinComponent:r.s.components?.find(x=>x.key==='spin')?.score??null}))};}finally{Object.keys(w.state).forEach(k=>delete w.state[k]);Object.assign(w.state,saved);}}
function pair(a,b){return {pair:`${a.id}->${b.id}`,topChanged:a.top!==b.top,topScoreDelta:Math.round((b.topScore-a.topScore)*10)/10,top5Moves:a.top5.filter(x=>{const y=b.top5.find(z=>z.product===x.product);return !y||y.rank!==x.rank;}).length};}
async function run(){const w=frame.contentWindow;await loadScript(w,'tests/driver-continuous-flight-v224.js');await loadScript(w,'tests/driver-continuous-flight-v225.js');const defs=[{id:'CL1',launch:10.9,spin:2300},{id:'CL2',launch:11.1,spin:2300},{id:'CS1',launch:12.5,spin:2090},{id:'CS2',launch:12.5,spin:2110},{id:'CH1',launch:12.5,spin:2990},{id:'CH2',launch:12.5,spin:3010}];const stable=defs.map(d=>runCase(w,w.FORM_DRIVER_ENGINE_V80,d)),alt=defs.map(d=>runCase(w,w.FORM_DRIVER_CONTINUOUS_FLIGHT_V225,d));const report={generatedAt:new Date().toISOString(),productionScoringChanged:false,stable,alternate:alt,pairs:{stable:[pair(stable[0],stable[1]),pair(stable[2],stable[3]),pair(stable[4],stable[5])],alternate:[pair(alt[0],alt[1]),pair(alt[2],alt[3]),pair(alt[4],alt[5])]}};window.FORM_CARRY_FLIGHT_REGRESSION_V225=report;out.textContent=JSON.stringify(report,null,2);}
document.getElementById('run').onclick=()=>run().catch(e=>out.textContent=String(e.stack||e));
</script></body></html>
