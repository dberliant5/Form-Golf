name: Driver v225 Production Candidate
on:
  push:
    paths:
      - 'assets/driver-engine-v80.js'
      - 'tests/build-driver-engine-v225.py'
      - 'tests/driver-v225-production-candidate.html'
      - 'tests/run-driver-v225-production-candidate.mjs'
      - 'tests/driver-v225-carry-boundaries.html'
      - 'tests/run-driver-v225-carry-boundaries.mjs'
      - 'tests/driver-v225-live-stack.html'
      - 'tests/run-driver-v225-live-stack.mjs'
      - '.github/workflows/driver-v225-production-candidate.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build generated v225 engine
        run: python3 tests/build-driver-engine-v225.py
      - name: Verify generated scope
        run: |
          test -s assets/driver-engine-v225.js
          grep -q "FORM 8.225" assets/driver-engine-v225.js
          grep -q "continuous speed-aware needs" assets/driver-engine-v225.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run generated candidate matrix regression
        run: node tests/run-driver-v225-production-candidate.mjs
      - name: Run focused carry boundary regression
        run: node tests/run-driver-v225-carry-boundaries.mjs
      - name: Run exact live-stack regression
        run: node tests/run-driver-v225-live-stack.mjs
      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-v225-production-candidate
          path: |
            tests/baselines/driver-v225-production-candidate*.json
            tests/baselines/driver-v225-carry-boundaries.json
            tests/baselines/driver-v225-live-stack.json
