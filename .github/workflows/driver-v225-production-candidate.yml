name: Driver v225 Production Candidate
on:
  push:
    paths:
      - 'assets/driver-engine-v80.js'
      - 'tests/build-driver-engine-v225.py'
      - 'tests/driver-v225-production-candidate.html'
      - 'tests/run-driver-v225-production-candidate.mjs'
      - 'tests/driver-carry-boundaries-helper-v226.js'
      - 'tests/driver-v225-post-switch.html'
      - 'tests/run-driver-v225-post-switch.mjs'
      - '.github/workflows/driver-v225-production-candidate.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build generated v225 engine
        run: python3 tests/build-driver-engine-v225.py
      - name: Verify generated scope
        run: |
          test -s assets/driver-engine-v225.js
          grep -q "FORM 8.225" assets/driver-engine-v225.js
          grep -q "continuous speed-aware needs" assets/driver-engine-v225.js
          git diff --exit-code -- assets/driver-engine-v225.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run deterministic candidate regression
        run: node tests/run-driver-v225-production-candidate.mjs
      - name: Stage local production switch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="assets/driver-engine-v80.js?v=8.0"></script>'
          new='<script src="assets/driver-engine-v225.js?v=8.225"></script>'
          assert s.count(old)==1, f'Expected exactly one live v80 engine reference, found {s.count(old)}'
          assert 'assets/driver-engine-v225.js?v=8.225' not in s
          p.write_text(s.replace(old,new,1))
          PY
      - name: Run post-switch live-index regression
        run: node tests/run-driver-v225-post-switch.mjs
      - name: Commit validated production switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote validated driver engine v225"
          git push origin HEAD:main
      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-v225-production-candidate
          path: |
            tests/baselines/driver-v225-production-candidate*.json
            tests/baselines/driver-v225-post-switch.json
