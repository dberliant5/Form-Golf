name: Promote Validated Driver Engine v226

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-driver-upgrade-gates-v226.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify candidate syntax and capture frozen regression
        run: |
          node --check assets/driver-engine-v226.js
          node --check assets/driver-config-v230.js
          cp tests/baselines/driver-stable-v220-summary.json /tmp/driver-stable-v220-summary.json

      - name: Stage v226 production reference and smoke safeguard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          old='assets/driver-engine-v225.js?v=8.225'
          new='assets/driver-engine-v226.js?v=8.226'
          if html.count(old) != 1:
              raise SystemExit(f'Expected exactly one active v225 reference, found {html.count(old)}')
          if 'assets/driver-config-v230.js?v=8.230' not in html:
              raise SystemExit('Validated v230 config reference missing')
          if 'assets/driver-config-v81.js?v=8.1' in html:
              raise SystemExit('Obsolete v81 config is active')
          index.write_text(html.replace(old,new,1),encoding='utf-8')

          smoke=Path('.github/workflows/form-smoke.yml')
          s=smoke.read_text(encoding='utf-8')
          if s.count('assets/driver-engine-v225.js') != 2:
              raise SystemExit(f'Expected two stale v225 smoke references, found {s.count("assets/driver-engine-v225.js")}')
          s=s.replace('assets/driver-engine-v225.js','assets/driver-engine-v226.js')
          s=s.replace('v=8.225','v=8.226')
          smoke.write_text(s,encoding='utf-8')
          PY

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start staged v226 server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2

      - name: Run v226 promotion gates
        run: |
          node tests/run-driver-v226-candidate-gate-v238.mjs
          node tests/run-driver-upgrade-semantics-v236.mjs
          node tests/run-driver-upgrade-gap-diagnostic-v237.mjs
          node tests/run-driver-regression.mjs

      - name: Verify regression core is unchanged
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          frozen=json.loads(Path('/tmp/driver-stable-v220-summary.json').read_text())
          current=json.loads(Path('tests/baselines/driver-stable-v220-summary.json').read_text())
          keys=['matrixCases','aoaInvariant','thresholdPairs','currentSatisfactionInvariant','doubleCountStress']
          diff={k:(frozen.get(k),current.get(k)) for k in keys if frozen.get(k)!=current.get(k)}
          if diff:
              raise SystemExit('Driver regression core changed: '+json.dumps(diff,sort_keys=True))
          print('Driver regression core unchanged on staged v226.')
          PY

      - name: Verify promoted stack before commit
        run: |
          node --check assets/driver-engine-v226.js
          node --check assets/driver-config-v230.js
          grep -q 'assets/driver-engine-v226.js?v=8.226' index.html
          grep -q 'assets/driver-config-v230.js?v=8.230' index.html
          ! grep -q 'assets/driver-engine-v225.js?v=8.225' index.html
          ! grep -q 'assets/driver-config-v81.js?v=8.1' index.html
          grep -q 'node --check assets/driver-engine-v226.js' .github/workflows/form-smoke.yml
          grep -q 'assets/driver-engine-v226.js?v=8.226' .github/workflows/form-smoke.yml

      - name: Commit validated promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/form-smoke.yml
          git diff --cached --quiet && { echo 'No promotion changes to commit.'; exit 0; }
          git commit -m 'Promote validated Driver engine v226'
          git push origin HEAD:main
