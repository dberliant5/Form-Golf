name: Promote Validated Driver Engine v226

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-driver-upgrade-gates-v226.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify candidate syntax and active production stack
        run: |
          node --check assets/driver-engine-v225.js
          node --check assets/driver-engine-v226.js
          node --check assets/driver-config-v230.js
          grep -q 'assets/driver-engine-v225.js?v=8.225' index.html
          grep -q 'assets/driver-config-v230.js?v=8.230' index.html
          ! grep -q 'assets/driver-config-v81.js?v=8.1' index.html

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local production server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2

      - name: Capture current v225 regression
        run: |
          node tests/run-driver-regression.mjs
          cp tests/baselines/driver-stable-v220-summary.json /tmp/driver-v225-current-summary.json
          git checkout -- tests/baselines/driver-stable-v220-summary.json

      - name: Stage only the validated v226 production reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          old='assets/driver-engine-v225.js?v=8.225'
          new='assets/driver-engine-v226.js?v=8.226'
          if html.count(old) != 1:
              raise SystemExit(f'Expected exactly one active v225 reference, found {html.count(old)}')
          if 'assets/driver-config-v230.js?v=8.230' not in html:
              raise SystemExit('Validated v230 config reference missing')
          if 'assets/driver-config-v81.js?v=8.1' in html:
              raise SystemExit('Obsolete v81 config is active')
          index.write_text(html.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run staged v226 promotion gates
        run: |
          node tests/run-driver-v226-candidate-gate-v238.mjs
          node tests/run-driver-upgrade-semantics-v236.mjs
          node tests/run-driver-upgrade-gap-diagnostic-v237.mjs
          node tests/run-driver-regression.mjs

      - name: Require current v225 and v226 regression parity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          v225=json.loads(Path('/tmp/driver-v225-current-summary.json').read_text())
          v226=json.loads(Path('tests/baselines/driver-stable-v220-summary.json').read_text())
          keys=['matrixCases','aoaInvariant','thresholdPairs','currentSatisfactionInvariant','doubleCountStress']
          diff={k:(v225.get(k),v226.get(k)) for k in keys if v225.get(k)!=v226.get(k)}
          if diff:
              raise SystemExit('Current v225/v226 regression mismatch: '+json.dumps(diff,sort_keys=True))
          print('Current v225 and staged v226 regression cores are identical.')
          PY
          git checkout -- tests/baselines/driver-stable-v220-summary.json

      - name: Verify staged production stack
        run: |
          node --check assets/driver-engine-v226.js
          node --check assets/driver-config-v230.js
          grep -q 'assets/driver-engine-v226.js?v=8.226' index.html
          grep -q 'assets/driver-config-v230.js?v=8.230' index.html
          ! grep -q 'assets/driver-engine-v225.js?v=8.225' index.html
          ! grep -q 'assets/driver-config-v81.js?v=8.1' index.html
          git diff --exit-code -- tests/baselines/driver-stable-v220-summary.json

      - name: Commit validated engine reference
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No promotion change to commit.'; exit 0; }
          git commit -m 'Promote validated Driver engine v226'
          git push origin HEAD:main
