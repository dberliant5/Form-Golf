name: Driver Flight Neighborhoods v222
on:
  push:
    branches: [main]
    paths:
      - 'tests/driver-flight-neighborhoods-v222.html'
      - 'tests/run-driver-flight-neighborhoods-v222.mjs'
      - '.github/workflows/driver-flight-neighborhoods-v222.yml'
  workflow_dispatch:
jobs:
  neighborhoods:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run focused neighborhoods
        run: node tests/run-driver-flight-neighborhoods-v222.mjs
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: driver-flight-neighborhoods-v222
          path: tests/baselines/driver-flight-neighborhoods-v222.json
          if-no-files-found: error
