name: Driver Regression Baseline
on:
  push:
    branches: [main]
    paths:
      - 'tests/driver-regression-matrix-v219.js'
      - 'tests/driver-regression-aoa-v220.js'
      - 'tests/driver-regression-runner-v220.html'
      - 'tests/run-driver-regression.mjs'
      - 'tests/driver-regression-trigger.txt'
      - '.github/workflows/driver-regression-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run stable regression baseline
        run: node tests/run-driver-regression.mjs
      - name: Commit frozen baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/baselines/driver-stable-v220.json tests/baselines/driver-stable-v220-summary.json
          git diff --cached --quiet || git commit -m "Freeze stable driver regression baseline v220"
          git push
      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: driver-stable-v220-baseline
          path: tests/baselines/
          if-no-files-found: error
