name: FORM Deploy Relay

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    if: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, 'FORM_DEPLOY') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Collect and decode FORM build
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os, re, base64, gzip, json, subprocess, time

          issue_number = os.environ["ISSUE_NUMBER"]
          repository = os.environ["GITHUB_REPOSITORY"]
          body = os.environ.get("ISSUE_BODY", "")

          for _ in range(150):
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/issues/{issue_number}/comments", "--paginate"],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              comments = json.loads(result.stdout or "[]")
              combined = body + "\n" + "\n".join(c.get("body", "") for c in comments)
              match = re.search(r'FORM_PAYLOAD_START\s*(.*?)\s*FORM_PAYLOAD_END', combined, re.S)
              if match:
                  payload = re.sub(r'\s+', '', match.group(1))
                  html = gzip.decompress(base64.b64decode(payload))
                  open("index.html", "wb").write(html)
                  print(f"Decoded {len(html):,} bytes into index.html")
                  break
              time.sleep(2)
          else:
              raise SystemExit("FORM payload was incomplete after waiting for issue comments.")
          PY

      - name: Publish index.html
        run: |
          git config user.name "FORM Deploy Bot"
          git config user.email "actions@github.com"
          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy latest FORM build"
            git push
          fi

      - name: Close deployment issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --comment "FORM deployment workflow finished."
