name: FORM Deploy Relay

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  deploy:
    if: ${{ github.event_name == 'issues' && startsWith(github.event.issue.title, 'FORM_ARCHIVE_DEPLOY') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct split FORM build
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python - <<'PY'
          import base64, json, os, re, subprocess, tarfile, time
          repo = os.environ['GITHUB_REPOSITORY']
          issue = os.environ['ISSUE_NUMBER']
          for _ in range(120):
              result = subprocess.run(
                  ['gh','api',f'repos/{repo}/issues/{issue}/comments','--paginate'],
                  capture_output=True,text=True,check=True)
              comments = json.loads(result.stdout or '[]')
              parts = {}
              total = None
              for comment in comments:
                  body = comment.get('body','')
                  m = re.fullmatch(r'FORM_ARCHIVE_PART\s+(\d+)/(\d+)\s*\n([A-Za-z0-9+/=\s]+)', body, re.S)
                  if not m: continue
                  number, count = int(m.group(1)), int(m.group(2))
                  total = count
                  parts[number] = re.sub(r'\s+','',m.group(3))
              if total and len(parts) == total:
                  payload = ''.join(parts[i] for i in range(1,total+1))
                  archive = base64.b64decode(payload, validate=True)
                  open('/tmp/form-build.tar.gz','wb').write(archive)
                  with tarfile.open('/tmp/form-build.tar.gz','r:gz') as tar:
                      tar.extractall('.')
                  print(f'Reconstructed {len(archive):,} archive bytes from {total} parts')
                  break
              time.sleep(2)
          else:
              raise RuntimeError('Timed out waiting for all FORM archive parts')
          PY

      - name: Validate JavaScript
        run: |
          cat assets/app-1.js assets/app-2.js assets/app-3.js > /tmp/form-app.js
          node --check /tmp/form-app.js
          node --check assets/catalog-data.js

      - name: Publish split FORM application
        run: |
          git config user.name "FORM Deploy Bot"
          git config user.email "actions@github.com"
          git add index.html README.md assets/
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy split FORM v6.1 application"
            git push
          fi

      - name: Close successful deployment issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Split FORM deployment completed successfully."
