name: FORM luxury fitting UX v236
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/form-fitting-luxury-v236.css'
      - '.github/workflows/form-fitting-luxury-v236.yml'
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify visual-only scope
        run: |
          git fetch origin main --depth=1
          test -z "$(git diff --name-only origin/main -- | grep -v -E '^(index.html|assets/form-fitting-luxury-v236.css|.github/workflows/form-fitting-luxury-v236.yml)$')" || exit 1
          grep -q 'driver-vertical-strike-v235.js' index.html
          grep -q 'form-fitting-luxury-v236.css' index.html
          grep -q 'FORM Live Build 14.11.7' index.html
      - name: Check wrapper syntax
        run: node tests/check-driver-wrapper-syntax-v244.mjs
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Pages asset contract
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q 'form-fitting-luxury-v236.css'
          curl -fsS http://127.0.0.1:8080/assets/form-fitting-luxury-v236.css | grep -q 'FORM premium fitting experience v236'
      - name: Run stable driver regression
        run: node tests/run-driver-regression.mjs
      - name: Clean generated regression files
        if: always()
        run: rm -f tests/baselines/driver-stable-v220.json tests/baselines/driver-stable-v220-summary.json
