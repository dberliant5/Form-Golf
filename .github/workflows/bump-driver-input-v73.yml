name: Deploy FORM 7.3 Guided Inputs
on:
  push:
    paths:
      - '.github/workflows/bump-driver-input-v73.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate
        run: node --check assets/driver-input-guard-v71.js
      - name: Cache bust 7.3
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/driver-input-guard-v71.js?v=7.1','assets/driver-input-guard-v71.js?v=7.3')
          s=s.replace('assets/driver-input-guard-v71.js?v=7.2','assets/driver-input-guard-v71.js?v=7.3')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load FORM 7.3 guided inputs'
          git push