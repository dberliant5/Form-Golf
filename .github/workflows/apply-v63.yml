name: Apply FORM v6.3

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: ${{ github.event.issue.title == 'FORM_V63_APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire v6.3 assets
        run: python scripts/apply-v63.py

      - name: Validate
        run: |
          node --check assets/driver-v63.js
          grep -q 'assets/driver-v63.css' index.html
          grep -q 'assets/driver-v63.js' index.html

      - name: Commit v6.3
        run: |
          git config user.name "FORM QA Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "FORM v6.3 driver experience fixes"
          git push

      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "FORM v6.3 applied and validated."
