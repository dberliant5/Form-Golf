name: Driver Upgrade Gap Diagnostic v237
on:
  push:
    branches: [main]
    paths:
      - 'tests/run-driver-upgrade-gap-diagnostic-v237.mjs'
      - '.github/workflows/driver-upgrade-gap-diagnostic-v237.yml'
      - 'assets/driver-engine-v225.js'
      - 'assets/driver-config-v230.js'
      - 'index.html'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run upgrade gap diagnostic
        run: node tests/run-driver-upgrade-gap-diagnostic-v237.mjs
