name: Driver Continuous Flight v221
on:
  push:
    branches: [main]
    paths:
      - 'tests/driver-continuous-flight-v221.js'
      - 'tests/driver-continuous-flight-runner-v221.html'
      - 'tests/run-driver-continuous-flight-targeted.mjs'
      - '.github/workflows/driver-continuous-flight-v221.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/form-http.log 2>&1 &
          sleep 2
      - name: Run stable vs continuous comparison
        run: node tests/run-driver-continuous-flight-targeted.mjs
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: driver-continuous-v221-comparison
          path: tests/baselines/driver-continuous-v221-*.json
          if-no-files-found: error
