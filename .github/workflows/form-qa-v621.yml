name: FORM v6.2.1 Navigation Patch

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: ${{ github.event.issue.title == 'FORM_QA_V621_APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/form-qa-v621.py
      - run: node --check assets/app-3.js
      - name: Commit
        run: |
          git config user.name "FORM QA Bot"
          git config user.email "actions@github.com"
          rm -f .github/workflows/form-qa-v621.yml .github/scripts/form-qa-v621.py
          git add assets/app-3.js .github/workflows/form-qa-v621.yml .github/scripts/form-qa-v621.py
          git commit -m "Fix Driver refit navigation"
          git push
      - name: Close issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Driver refit navigation fixed and validated."
