name: Repair FORM driver DOM
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Trigger driver DOM repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair driver review and results structure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad='''      </section>\n\n      \n</div>\n        <div id="keep" class="keep"></div><div id="resultList"></div>\n      </section>\n\n      <div class="flowNav" id="flowNav">'''
          good='''      </section>\n\n      <section id="results" class="step hidden"></section>\n\n      <div class="flowNav" id="flowNav">'''
          if bad not in s:
              raise SystemExit('Expected malformed driver block not found')
          s=s.replace(bad,good,1)
          p.write_text(s)
          PY
          grep -q '<section id="results" class="step hidden"></section>' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<section id="step9"')
          b=s.index('<div class="flowNav" id="flowNav">',a)
          segment=s[a:b]
          assert segment.count('<section') == 2, segment[-500:]
          assert segment.count('</section>') == 2, segment[-500:]
          print('Driver step 9/results DOM structure verified')
          PY
          git config user.name "FORM QA Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Repair driver review and results DOM"
          git push
