name: Apply FORM 6.4 cache bust
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache-bust:
    if: github.event.head_commit.message == 'Apply FORM 6.4 cache bust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version driver assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/driver-v63.css"','assets/driver-v63.css?v=6.4"')
          s=s.replace('assets/driver-v63.js"></script>','assets/driver-v63.js?v=6.4"></script>')
          p.write_text(s)
          PY
          grep -q 'driver-v63.css?v=6.4' index.html
          grep -q 'driver-v63.js?v=6.4' index.html
          git config user.name "FORM QA Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Version FORM 6.4 driver assets"
          git push
