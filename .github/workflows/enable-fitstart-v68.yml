name: Enable FORM 6.8 Fit Start
on:
  push:
    paths:
      - '.form-enable-fitstart-v68'
permissions:
  contents: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire fit-start module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="assets/fitstart-v68.js?v=6.8"></script>'
          if tag not in s:
              s=s.replace('</body>',tag+'\n</body>')
          p.write_text(s)
          PY
          node --check assets/fitstart-v68.js
          grep -q 'fitstart-v68.js?v=6.8' index.html
      - name: Commit
        run: |
          git config user.name 'FORM Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Enable FORM 6.8 fitting entry flow'
          git push