name: Bump FORM 6.9 cache
on:
  push:
    paths:
      - '.github/workflows/bump-form-69.yml'
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump driver asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('assets/driver-v63.css?v=6.7','assets/driver-v63.css?v=6.9')
          s=s.replace('assets/driver-v63.js?v=6.7','assets/driver-v63.js?v=6.9')
          s=s.replace('assets/driver-engine-v67.js?v=6.7','assets/driver-engine-v67.js?v=6.9')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load FORM 6.9 driver engine"
          git push
