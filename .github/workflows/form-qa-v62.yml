name: FORM v6.2 QA Patch

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: ${{ github.event.issue.title == 'FORM_QA_V62_APPLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/form-qa-v62.py
      - name: Validate JavaScript
        run: node --check assets/app-3.js
      - name: Commit changes
        run: |
          git config user.name "FORM QA Bot"
          git config user.email "actions@github.com"
          rm -f .github/workflows/form-qa-v62.yml .github/scripts/form-qa-v62.py
          git add assets/app-3.js .github/workflows/form-qa-v62.yml .github/scripts/form-qa-v62.py
          git commit -m "FORM v6.2 driver and bag QA"
          git push
      - name: Close trigger issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "FORM v6.2 QA patch applied successfully."
