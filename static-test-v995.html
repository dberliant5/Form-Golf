<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORM Live Build 10.93.1</title>
<style>html,body{margin:0;background:#fff;color:#263e33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px}</style>
</head>
<body>
<p>Opening FORM…</p>
<script>
(async function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var build=params.get('v')||('live-'+Date.now());
  var paths=[
    'index.html',
    'assets/driver-evidence-v83.js','assets/driver-evidence-v90.js','assets/driver-engine-hardening-v129.js','assets/driver-ranking-diversity-v142.js','assets/driver-score-calibration-v146.js','assets/driver-handedness-calibration-v148.js','assets/driver-strike-reliability-v149.js','assets/driver-priority-integrity-v151.js','assets/driver-results-cleanup-v187.js','assets/driver-results-experience-v184.js','assets/driver-results-controller-v96.js','assets/driver-results-editorial-v185.js','assets/driver-results-narrative-v186.js','assets/driver-algorithm-calibration-v145.js','assets/driver-config-bridge-v157.js','assets/driver-profile-insight-reliability-v167.js','assets/driver-interview-fixes-v136.js','assets/driver-interview-ux-v104.js','assets/driver-interview-quality-v150.js','assets/driver-interview-copy-v156.js','assets/driver-range-first-v160.js','assets/driver-confidence-input-quality-v165.js','assets/form-methodology-consistency-v162.js','assets/driver-build-integrity-v154.js','assets/driver-live-feedback-v169.js'
  ];
  try{
    var responses=await Promise.all(paths.map(function(path,i){var q=i===0?'html='+encodeURIComponent(build):'fresh='+Date.now();return fetch(path+'?'+q,{cache:'no-store'});}));
    responses.forEach(function(r,i){if(!r.ok)throw new Error(paths[i]+' '+r.status);});
    var texts=await Promise.all(responses.map(function(r){return r.text();}));
    var html=texts[0];
    html=html.replace(/(src|href)=(['"])(assets\/[^'"?#]+)(?:\?[^'"#]*)?\2/g,function(_,attr,q,path){return attr+'='+q+path+'?v='+encodeURIComponent(build)+q;});
    function safeScript(code){return String(code).replace(/<\/script/gi,'<\\/script');}
    var injected=texts.slice(1).map(function(code){return '<script>'+safeScript(code)+'<\/script>';}).join('');
    injected+='<script>try{history.replaceState(null,"",location.pathname+"?v='+encodeURIComponent(build)+'")}catch(e){}<\/script>';
    html=html.replace('</body>',injected+'</body>');document.open();document.write(html);document.close();
  }catch(err){document.body.innerHTML='<p>FORM failed to open. Please reload.</p>';console.error(err);}
})();
</script>
</body>
</html>
