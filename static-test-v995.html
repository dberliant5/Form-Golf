<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORM Live Build</title>
<style>html,body{margin:0;background:#fff;color:#263e33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:24px}</style>
</head>
<body>
<p>Opening FORM…</p>
<script>
(async function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var build=params.get('v')||('live-'+Date.now());
  try{
    var res=await fetch('index.html?html='+encodeURIComponent(build),{cache:'no-store'});
    if(!res.ok)throw new Error('index '+res.status);
    var html=await res.text();
    // Rewrite every local asset URL to this test build so no stale hard-coded cache key survives.
    html=html.replace(/(src|href)=(['"])(assets\/[^'"?#]+)(?:\?[^'"#]*)?\2/g,function(_,attr,q,path){
      return attr+'='+q+path+'?v='+encodeURIComponent(build)+q;
    });
    // Load the latest results-layout refinement explicitly in the live harness.
    html=html.replace('</body>','<script src="assets/driver-results-layout-v121.js?v='+encodeURIComponent(build)+'"><\/script></body>');
    // Make the rendered page retain the build in its URL-aware bootstrap logic.
    html=html.replace('<head>','<head><script>try{history.replaceState(null,"",location.pathname+"?v='+encodeURIComponent(build)+'")}catch(e){}<\/script>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<p>FORM failed to open. Please reload.</p>';
    console.error(err);
  }
})();
</script>
</body>
</html>
