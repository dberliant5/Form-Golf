<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FORM 9.9.5 Static Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#formFrame{display:block;border:0;width:100%;height:100%;min-height:100dvh;background:#fff}
#diag{position:fixed;left:8px;bottom:8px;z-index:2147483647;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.78);color:#fff;font:11px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.72}
</style>
</head>
<body>
<iframe id="formFrame" title="FORM" src="index.html?v=9.9.5-static"></iframe>
<div id="diag">STATIC 9.9.5 · loading</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('formFrame');
var diag=document.getElementById('diag');
var boundDoc=null;
function setDiag(t){diag.textContent='STATIC 9.9.5 · '+t;}
function startFit(w,b){
  if(b){b.disabled=false;b.textContent='Preparing your fit…';b.setAttribute('data-static-fired','1');}
  setDiag('tap received');
  setTimeout(function(){
    try{
      if(typeof w.FORM_START_DRIVER_RESULTS==='function'){w.FORM_START_DRIVER_RESULTS();setDiag('controller started');return;}
      if(typeof w.__FORM_BASE_SHOW_RESULTS==='function'){w.__FORM_BASE_SHOW_RESULTS.call(w);setDiag('base results started');return;}
      if(typeof w.showResults==='function'){w.showResults();setDiag('showResults started');return;}
      throw new Error('No results function');
    }catch(err){
      console.error('STATIC 9.9.5 Generate failure',err);
      if(b){b.disabled=false;b.textContent='Generate My Fit →';}
      setDiag('results function missing');
    }
  },0);
}
function bind(){
  var w,d;
  try{w=frame.contentWindow;d=w.document;}catch(e){setDiag('frame access blocked');return;}
  if(!d||d===boundDoc)return;
  boundDoc=d;
  setDiag('app loaded');
  function hit(e){
    var t=e.target;
    var b=t&&t.closest?t.closest('#step9 .readyBox button'):null;
    if(!b)return;
    e.preventDefault();
    e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    startFit(w,b);
  }
  d.addEventListener('pointerdown',hit,true);
  d.addEventListener('touchstart',hit,{capture:true,passive:false});
  d.addEventListener('click',hit,true);
  setInterval(function(){
    try{
      var b=d.querySelector('#step9 .readyBox button');
      if(!b)return;
      b.disabled=false;
      b.style.pointerEvents='auto';
      b.style.touchAction='manipulation';
      b.style.position='relative';
      b.style.zIndex='2147483647';
      b.onclick=function(e){if(e){e.preventDefault();e.stopPropagation();}startFit(w,b);return false;};
    }catch(e){}
  },250);
}
frame.addEventListener('load',function(){setDiag('frame loaded');bind();});
setInterval(bind,500);
})();
</script>
</body>
</html>
